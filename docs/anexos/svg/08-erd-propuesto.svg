ención,</tspan><tspan x="49" y="823.45">cada consumo debe tener su salida; esta regla requiere lógica transaccional.</tspan><tspan x="49" y="842.35">Definir política de anulaciones y borrados antes de aprobar este modelo.</tspan></text></svg>