-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="465.0" y="284.175">Cada mantención</tspan><tspan x="465.0" y="301.725">pertenece a</tspan><tspan x="465.0" y="319.27500000000003">un activo.</tspan></text><rect x="35" y="530" width="860" height="145" rx="0" fill="#fff7e8" stroke="#e7bf7a" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="14" fill="#172b4d" font-weight="400" text-anchor="start"><tspan x="49" y="569.25">PK: clave primaria · FK: clave foránea · UQ: valor único.</tspan><tspan x="49" y="588.15">Todos los campos son NOT NULL. Un activo puede tener cero o muchas mantenciones.</tspan><tspan x="49" y="607.05">Repuestos no tiene relación con mantenciones en este esquema.</tspan><tspan x="49" y="625.95">El borrado en cascada está configurado en el ORM; no como ON DELETE CASCADE</tspan><tspan x="49" y="644.85">en la migración. Valores por defecto 0: ORM, no defaults de servidor.</tspan></text><rect x="965" y="530" width="365" height="145" rx="0" fill="#fff7e8" stroke="#e7bf7a" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="14" fill="#172b4d" font-weight="400" text-anchor="start"><tspan x="979" y="569.25">No hay tablas de usuarios, consumos,</tspan><tspan x="979" y="588.15">movimientos ni alertas persistidas.</tspan><tspan x="979" y="607.05"></tspan><tspan x="979" y="625.95">Esquema deducido de modelos y</tspan><tspan x="979" y="644.85">migraciones; no inspeccionado en Neon.</tspan></text></svg>