<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="740" viewBox="0 0 1260 740" role="img"><title>02 / Arquitectura de contenedores · C4 nivel 2</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#62748b"/></marker><marker id="one" markerWidth="20" markerHeight="20" refX="1" refY="10" orient="auto"><path d="M7,2 V18 M13,2 V18" fill="none" stroke="#62748b" stroke-width="1.7"/></marker><marker id="many" markerWidth="28" markerHeight="22" refX="27" refY="11" orient="auto"><circle cx="6" cy="11" r="4" fill="white" stroke="#62748b" stroke-width="1.7"/><path d="M14,11 L27,2 M14,11 H27 M14,11 L27,20" fill="none" stroke="#62748b" stroke-width="1.7"/></marker></defs><rect width="1260" height="740" fill="white"/><text font-family="Arial, sans-serif" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start"><tspan x="32" y="45.95">02 / Arquitectura de contenedores · C4 nivel 2</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#087f8c" font-weight="700" text-anchor="start"><tspan x="32" y="79.05">ACTUAL · verificado en código</tspan></text><text font-family="Arial, sans-serif" font-size="12" fill="#62748b" font-weight="400" text-anchor="start"><tspan x="32" y="719.9">HYDRA-ONE  /  Anexo técnico  /  28 oct 2026  /  fuente: código 5d449af</tspan></text><rect x="35" y="125" width="1190" height="445" rx="0" fill="#f7f9fc" stroke="#adbacc" stroke-width="1.6" stroke-dasharray="7 5"/><text font-family="Arial, sans-serif" font-size="15" fill="#62748b" font-weight="700" text-anchor="start"><tspan x="50" y="151.875">LÍMITE DEL SISTEMA HYDRA-ONE · monolito modular</tspan></text><rect x="75" y="230" width="275" height="180" rx="8" fill="#ffffff" stroke="#175cd3" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="17" fill="#175cd3" font-weight="700" text-anchor="middle"><tspan x="212.5" y="260.525">Aplicación web / SPA</tspan></text><text font-family="Arial, sans-serif" font-size="15" fill="#172b4d" font-weight="400" text-anchor="middle"><tspan x="212.5" y="324.125">React + TypeScript</tspan><tspan x="212.5" y="344.375">Se ejecuta en el navegador</tspan><tspan x="212.5" y="364.625">Páginas y formularios</tspan></text><rect x="480" y="230" width="300" height="180" rx="8" fill="#ffffff" stroke="#175cd3" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="17" fill="#175cd3" font-weight="700" text-anchor="middle"><tspan x="630.0" y="260.525">API de aplicación</tspan></text><text font-family="Arial, sans-serif" font-size="15" fill="#172b4d" font-weight="400" text-anchor="middle"><tspan x="630.0" y="324.125">FastAPI + Pydantic</tspan><tspan x="630.0" y="344.375">Routers con lógica de negocio</tspan><tspan x="630.0" y="364.625">SQLAlchemy + psycopg</tspan></text><rect x="925" y="230" width="260" height="180" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="17" fill="#087f8c" font-weight="700" text-anchor="middle"><tspan x="1055.0" y="260.525">Base de datos</tspan></text><text font-family="Arial, sans-serif" font-size="15" fill="#172b4d" font-weight="400" text-anchor="middle"><tspan x="1055.0" y="324.125">PostgreSQL</tspan><tspan x="1055.0" y="344.375">Activos · Mantenciones</tspan><tspan x="1055.0" y="364.625">Repuestos</tspan></text><polyline points="350,300 480,300" fill="none" stroke="#62748b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="350" y="265" width="130" height="25" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="415.0" y="281.725">HTTP / JSON</tspan></text><polyline points="780,300 925,300" fill="none" stroke="#62748b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="780" y="265" width="145" height="25" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="852.5" y="281.725">SQL / PostgreSQL</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="220.0" y="477.6">VITE_API_URL define la API.</tspan><tspan x="220.0" y="496.5">No contiene credenciales de BD.</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="630.0" y="477.6">DATABASE_URL solo en backend.</tspan><tspan x="630.0" y="496.5">Una sesión SQLAlchemy por petición.</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="1055.0" y="477.6">Neon: proveedor indicado</tspan><tspan x="1055.0" y="496.5">por el equipo; remoto no auditado.</tspan></text><rect x="35" y="600" width="1190" height="70" rx="0" fill="#fff7e8" stroke="#e7bf7a" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="14" fill="#172b4d" font-weight="400" text-anchor="start"><tspan x="49" y="630.1">En desarrollo: Vite sirve el frontend y Uvicorn ejecuta FastAPI. Son procesos distintos.</tspan><tspan x="49" y="649.0">CORS permite el origen del frontend; CORS no reemplaza autenticación. No se verificó un despliegue productivo.</tspan></text></svg>