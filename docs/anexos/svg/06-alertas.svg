="596.725">sí</tspan></text><polyline points="1155,580 1155,615 1190,615 1190,655" fill="none" stroke="#62748b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="1200" y="590" width="50" height="25" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="1225.0" y="606.725">no</tspan></text><rect x="35" y="820" width="1290" height="100" rx="0" fill="#fff7e8" stroke="#e7bf7a" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="14" fill="#172b4d" font-weight="400" text-anchor="start"><tspan x="49" y="855.65">Se combinan los resultados A y B en una lista JSON. La bifurcación dibuja reglas, no tareas paralelas del servidor.</tspan><tspan x="49" y="874.55">«hoy» usa la fecha del servidor. El intervalo próximo incluye hoy y el séptimo día.</tspan><tspan x="49" y="893.4499999999999">No se guardan alertas; no hay correo ni tarea programada. Una nueva consulta vuelve a evaluar los datos.</tspan></text></svg>