<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1060" viewBox="0 0 1220 1060" role="img"><title>05 / Secuencia UML · registrar una mantención</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#62748b"/></marker><marker id="one" markerWidth="20" markerHeight="20" refX="1" refY="10" orient="auto"><path d="M7,2 V18 M13,2 V18" fill="none" stroke="#62748b" stroke-width="1.7"/></marker><marker id="many" markerWidth="28" markerHeight="22" refX="27" refY="11" orient="auto"><circle cx="6" cy="11" r="4" fill="white" stroke="#62748b" stroke-width="1.7"/><path d="M14,11 L27,2 M14,11 H27 M14,11 L27,20" fill="none" stroke="#62748b" stroke-width="1.7"/></marker></defs><rect width="1220" height="1060" fill="white"/><text font-family="Arial, sans-serif" font-size="26" fill="#172b4d" font-weight="700" text-anchor="start"><tspan x="32" y="45.95">05 / Secuencia UML · registrar una mantención</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#087f8c" font-weight="700" text-anchor="start"><tspan x="32" y="79.05">ACTUAL · verificado en código</tspan></text><text font-family="Arial, sans-serif" font-size="12" fill="#62748b" font-weight="400" text-anchor="start"><tspan x="32" y="1039.9">HYDRA-ONE  /  Anexo técnico  /  28 oct 2026  /  fuente: código 5d449af</tspan></text><rect x="35" y="125" width="230" height="65" rx="8" fill="#ffffff" stroke="#175cd3" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="16" fill="#175cd3" font-weight="700" text-anchor="middle"><tspan x="150.0" y="162.7">Usuario / formulario</tspan></text><polyline points="150,190 150,960" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="345" y="125" width="230" height="65" rx="8" fill="#ffffff" stroke="#175cd3" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="16" fill="#175cd3" font-weight="700" text-anchor="middle"><tspan x="460.0" y="162.7">api.ts / fetch</tspan></text><polyline points="460,190 460,960" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="675" y="125" width="230" height="65" rx="8" fill="#ffffff" stroke="#175cd3" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="16" fill="#175cd3" font-weight="700" text-anchor="middle"><tspan x="790.0" y="162.7">FastAPI / router</tspan></text><polyline points="790,190 790,960" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="975" y="125" width="230" height="65" rx="8" fill="#ffffff" stroke="#175cd3" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="16" fill="#175cd3" font-weight="700" text-anchor="middle"><tspan x="1090.0" y="162.7">SQLAlchemy / BD</tspan></text><polyline points="1090,190 1090,960" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5"/><polyline points="150,245 460,245" fill="none" stroke="#62748b" stroke-width="1.7" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="305.0" y="230.725">1. Enviar formulario</tspan></text><polyline points="460,315 790,315" fill="none" stroke="#62748b" stroke-width="1.7" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="625.0" y="300.725">2. POST /api/mantenciones/</tspan></text><rect x="620" y="345" width="360" height="62" rx="0" fill="#fff7e8" stroke="#e7bf7a" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="14" fill="#172b4d" font-weight="400" text-anchor="start"><tspan x="634" y="371.1">Pydantic valida datos. Si son inválidos:</tspan><tspan x="634" y="390.0">HTTP 422; el router no ejecuta el alta.</tspan></text><polyline points="790,455 1090,455" fill="none" stroke="#62748b" stroke-width="1.7" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="940.0" y="440.725">3. Buscar activo_id</tspan></text><polyline points="1090,510 790,510" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="940.0" y="495.725">4. Activo o ausencia</tspan></text><rect x="350" y="550" width="830" height="360" rx="0" fill="none" stroke="#62748b" stroke-width="1.6"/><text font-family="Arial, sans-serif" font-size="14" fill="#172b4d" font-weight="700" text-anchor="start"><tspan x="365" y="576.55">alt [activo no existe]</tspan></text><polyline points="790,620 460,620" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="625.0" y="605.725">5a. HTTP 404</tspan></text><polyline points="350,660 1180,660" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5"/><text font-family="Arial, sans-serif" font-size="14" fill="#172b4d" font-weight="700" text-anchor="start"><tspan x="365" y="683.55">[activo existe]</tspan></text><polyline points="790,735 1090,735" fill="none" stroke="#62748b" stroke-width="1.7" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="940.0" y="720.725">5b. add → commit → refresh</tspan></text><polyline points="1090,795 790,795" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="940.0" y="780.725">6. Mantención persistida</tspan></text><polyline points="790,855 460,855" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="625.0" y="840.725">7. HTTP 201 + JSON</tspan></text><polyline points="460,950 150,950" fill="none" stroke="#62748b" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="13" fill="#62748b" font-weight="400" text-anchor="middle"><tspan x="305.0" y="935.725">8. Mostrar resultado</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#b65b13" font-weight="400" text-anchor="start"><tspan x="35" y="1003.55">Flujo de alta actual: no reserva repuestos, no descuenta stock y no genera movimientos.</tspan></text></svg>